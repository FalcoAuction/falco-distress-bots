name: Unit Tests

# Runs the runner/base/alert tests on every push and PR. The per-bot
# SIGALRM timeout test only executes on POSIX, which is why this runs
# here and not just on the Windows dev box.

on:
  push:
    paths:
      - "src/bots/_*.py"
      - "tests/**"
      - ".github/workflows/test.yml"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run tests
        # No Supabase creds on purpose: the tests fake the client.
        run: python -m unittest discover -s tests -v
