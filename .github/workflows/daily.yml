name: Falco Daily Pipeline

on:
  workflow_dispatch:
  schedule:
    # Twice daily — early-morning and mid-afternoon. Two passes/day keeps
    # the dialer queue fresh AND gives us a recovery window if the first
    # run hits a transient source-site hiccup.
    - cron: "0 12 * * *"  # 12:00 UTC = 7am CST — primary daily pass
    - cron: "0 21 * * *"  # 21:00 UTC = 4pm CST — afternoon refresh

# Don't cancel an in-progress run when a new one is queued; let the
# earlier one complete and just queue the next. Previously concurrent
# crons (May 3, May 4) auto-cancelled each other. weekly_heavy.yml
# shares this group so it queues behind a daily run instead of racing it.
concurrency:
  group: falco-daily-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # The runner's own budget (FALCO_RUN_BUDGET_MIN) is 75 min with a 10
    # min reserve for the critical tail, so this cap is a backstop, not
    # the thing that ends the run. 9 of 20 runs were hitting it.
    timeout-minutes: 90

    env:
      # ===== Bot scrapers (write directly to Supabase) =====
      # Bots ingest leads from public sources and upsert into the
      # falco-site Supabase homeowner_requests table. The dialer + /admin
      # read this live. Notion was removed 2026-04-29.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # ===== Runner budget =====
      # Global wall clock for src.bots._run_new. Non-critical bots are
      # skipped once less than the reserve remains; critical bots
      # (auto_promoter, skip-trace, reaper, decision_engine) always run.
      FALCO_RUN_BUDGET_MIN: "75"

      # ===== Optional enrichment APIs (currently unused in CI) =====
      # Stage 2/3 enrichment is gated off by default; runs via Vercel cron
      # at /api/cron/refresh-dialer. Set FALCO_ENABLE_LEGACY_STAGES=1 to
      # opt back in to running them here.
      FALCO_BATCHDATA_API_KEY: ${{ secrets.FALCO_BATCHDATA_API_KEY }}
      FALCO_ATTOM_API_KEY: ${{ secrets.FALCO_ATTOM_API_KEY }}
      # EnformionGO waterfall skip-trace (enformion_skip_trace_bot).
      # No-ops harmlessly until these secrets are set.
      FALCO_ENFORMION_AP_NAME: ${{ secrets.FALCO_ENFORMION_AP_NAME }}
      FALCO_ENFORMION_AP_PASSWORD: ${{ secrets.FALCO_ENFORMION_AP_PASSWORD }}

      # ===== Register of Deeds subscriptions (mtn_lis_pendens_rod) =====
      # Earliest foreclosure signal (60-120 days ahead). The bot reports
      # skipped_no_creds until these are set; preflight lists them.
      FALCO_DAVIDSON_ROD_USER: ${{ secrets.FALCO_DAVIDSON_ROD_USER }}
      FALCO_DAVIDSON_ROD_PASSWORD: ${{ secrets.FALCO_DAVIDSON_ROD_PASSWORD }}
      FALCO_WILLIAMSON_ROD_USER: ${{ secrets.FALCO_WILLIAMSON_ROD_USER }}
      FALCO_WILLIAMSON_ROD_PASSWORD: ${{ secrets.FALCO_WILLIAMSON_ROD_PASSWORD }}
      FALCO_HAMILTON_ROD_USER: ${{ secrets.FALCO_HAMILTON_ROD_USER }}
      FALCO_HAMILTON_ROD_PASSWORD: ${{ secrets.FALCO_HAMILTON_ROD_PASSWORD }}

      # ===== Decision engine (LLM-based lead classifier) =====
      # decision_engine_bot needs OPENAI_API_KEY or it fails with
      # "openai_unavailable". Add this secret in GitHub repo settings if
      # the bot is meant to run in CI; otherwise the bot exits cleanly
      # without affecting other scrapers.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # ===== Twilio Lookup (phone validation + line-type) =====
      # middle_tn_twilio_lookup_bot validates skip-traced phones to
      # confirm mobile/landline + carrier. Without these the bot fails
      # at startup ("TWILIO_ACCOUNT_SID/TWILIO_AUTH_TOKEN not set").
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}

      # ===== Alerting (src.bots._alert) =====
      # Emails a report through Resend only when there is something to
      # say. Without the key it prints to the job log and nothing else.
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      FALCO_ALERT_TO: ${{ secrets.FALCO_ALERT_TO }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # mtn_lis_pendens_rod drives a headless browser. Without the
          # browser binaries it fails every run with "playwright not
          # installed" and we silently lose a lis pendens lead source.
          python -m playwright install --with-deps chromium

      - name: Preflight (secrets, imports, Supabase reachable)
        # Fails the job only when Supabase is unreachable. Everything
        # else is reported and the run continues with that feature off.
        run: python -m src.bots._preflight

      - name: Run Falco pipeline (legacy bot scrapers -> Supabase)
        run: python -m src.run_all
        continue-on-error: true   # legacy stage; ~30s; must not block the new one

      - name: Run staging scrapers (-> homeowner_requests_staging)
        # Exits non-zero only when a critical bot (auto_promoter and the
        # chain feeding it) did not complete. Ordinary scraper failures
        # go to the alert step instead of turning the build red. This
        # step is deliberately NOT continue-on-error: a green check on a
        # run where the promoter never fired was the whole problem.
        run: python -m src.bots._run_new

      - name: Upload run status artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: falco-daily-status-${{ github.run_id }}
          path: |
            out/reports/preflight.json
            out/reports/new_bots_summary.json
            out/reports/latest_run_status.json
            out/reports/latest_run_summary.json
            out/reports/conversion_lane.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Alert (bot_run_health last 30d + this run's summary)
        if: always()
        run: python -m src.bots._alert
